<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540" style="border-radius:10px">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .terminal { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; font-size: 13px; }
      .prompt  { fill: #a6e3a1; }
      .cmd     { fill: #cdd6f4; }
      .dim     { fill: #585b70; }
      .green   { fill: #a6e3a1; }
      .blue    { fill: #89b4fa; }
      .yellow  { fill: #f9e2af; }
      .red     { fill: #f38ba8; }
      .teal    { fill: #94e2d5; }
      .mauve   { fill: #cba6f7; }
      .white   { fill: #cdd6f4; }
      .bold    { font-weight: 700; }

      /* Blinking cursor */
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .cursor { animation: blink 1s step-end infinite; }

      /* Line-by-line reveal animations */
      @keyframes fadein { from{opacity:0} to{opacity:1} }

      .l00 { animation: fadein 0.01s 0.3s both; }
      .l01 { animation: fadein 0.01s 0.8s both; }
      .l02 { animation: fadein 0.01s 1.3s both; }
      .l03 { animation: fadein 0.01s 1.8s both; }
      .l04 { animation: fadein 0.01s 2.3s both; }
      .l05 { animation: fadein 0.01s 2.8s both; }
      .l06 { animation: fadein 0.01s 3.3s both; }
      .l07 { animation: fadein 0.01s 3.8s both; }
      .l08 { animation: fadein 0.01s 4.1s both; }
      .l09 { animation: fadein 0.01s 4.4s both; }
      .l10 { animation: fadein 0.01s 4.7s both; }
      .l11 { animation: fadein 0.01s 5.0s both; }
      .l12 { animation: fadein 0.01s 5.3s both; }
      .l13 { animation: fadein 0.01s 5.6s both; }
      .l14 { animation: fadein 0.01s 5.9s both; }
      .l15 { animation: fadein 0.01s 6.2s both; }
      .l16 { animation: fadein 0.01s 6.5s both; }
      .l17 { animation: fadein 0.01s 6.8s both; }
      .l18 { animation: fadein 0.01s 7.1s both; }
      .l19 { animation: fadein 0.01s 7.4s both; }
      .l20 { animation: fadein 0.01s 7.7s both; }
      .l21 { animation: fadein 0.01s 8.0s both; }
      .l22 { animation: fadein 0.01s 8.5s both; }
      .l23 { animation: fadein 0.01s 9.0s both; }
      .l24 { animation: fadein 0.01s 9.5s both; }
      .l25 { animation: fadein 0.01s 10.0s both; }
      .l26 { animation: fadein 0.01s 10.5s both; }
      .l27 { animation: fadein 0.01s 11.0s both; }
      .l28 { animation: fadein 0.01s 11.5s both; }
      .l29 { animation: fadein 0.01s 12.0s both; }
      .l30 { animation: fadein 0.01s 12.5s both; }
      .l31 { animation: fadein 0.01s 13.0s both; }

      @keyframes progressbar {
        0%   { width: 0; }
        100% { width: 320px; }
      }
      .progress-fill { animation: progressbar 1.8s 4.7s ease-out both; }
    </style>
  </defs>

  <!-- Terminal window background -->
  <rect width="780" height="540" rx="10" fill="#1e1e2e"/>

  <!-- Title bar -->
  <rect width="780" height="38" rx="10" fill="#313244"/>
  <rect y="28" width="780" height="10" fill="#313244"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="19" r="7" fill="#f38ba8"/>
  <circle cx="46" cy="19" r="7" fill="#f9e2af"/>
  <circle cx="70" cy="19" r="7" fill="#a6e3a1"/>

  <!-- Title -->
  <text x="390" y="24" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#6c7086">gitpulse — terminal</text>

  <!-- Terminal content starts at y=62, line-height=22 -->
  <g class="terminal" transform="translate(28,62)">

    <!-- Line 0: first prompt + gitpulse init -->
    <g class="l00">
      <text class="prompt">~/projects</text>
      <text class="dim" x="79"> on </text>
      <text class="blue" x="102"> main</text>
      <text class="green" x="144"> ❯ </text>
      <text class="cmd" x="168">gitpulse init</text>
    </g>

    <!-- Line 1: setup wizard header -->
    <g class="l01" transform="translate(0,22)">
      <text class="teal">  ╔══════════════════════════════════╗</text>
    </g>
    <g class="l02" transform="translate(0,44)">
      <text class="teal">  ║   </text><text class="white bold" x="44">GitPulse Setup Wizard</text><text class="teal" x="220">         ║</text>
    </g>
    <g class="l03" transform="translate(0,66)">
      <text class="teal">  ╚══════════════════════════════════╝</text>
    </g>

    <!-- Line 4: enter key -->
    <g class="l04" transform="translate(0,88)">
      <text class="dim">    Enter your GROQ API key: </text><text class="mauve" x="216">gsk_••••••••••••••••</text>
    </g>
    <!-- Line 5: github username -->
    <g class="l05" transform="translate(0,110)">
      <text class="dim">    GitHub username: </text><text class="mauve" x="145">deepusharma</text>
    </g>
    <!-- Line 6: success -->
    <g class="l06" transform="translate(0,132)">
      <text class="green">  ✔ </text><text class="white" x="22">Config saved to </text><text class="yellow" x="142">~/.gitpulse.toml</text>
    </g>
    <g class="l07" transform="translate(0,154)">
      <text class="green">  ✔ </text><text class="white" x="22">API key saved to </text><text class="yellow" x="150">~/.env</text>
    </g>

    <!-- Line 8: blank -->
    <!-- Line 9: second prompt + generate -->
    <g class="l09" transform="translate(0,198)">
      <text class="prompt">~/projects</text>
      <text class="dim" x="79"> on </text>
      <text class="blue" x="102"> main</text>
      <text class="green" x="144"> ❯ </text>
      <text class="cmd" x="168">gitpulse generate --days 7</text>
    </g>

    <!-- Line 10: scanning repos -->
    <g class="l10" transform="translate(0,220)">
      <text class="dim">  Scanning repos from ~/.gitpulse.toml...</text>
    </g>

    <!-- Line 11: found commits -->
    <g class="l11" transform="translate(0,242)">
      <text class="blue">  ●</text>
      <text class="white" x="14"> Found </text>
      <text class="yellow" x="62">14 commits</text>
      <text class="white" x="138"> across </text>
      <text class="yellow" x="188">3 repos</text>
      <text class="white" x="247"> (last 7 days)</text>
    </g>

    <!-- Line 12: progress bar label -->
    <g class="l12" transform="translate(0,264)">
      <text class="dim">  Generating summary </text>
    </g>

    <!-- Line 13: progress bar track -->
    <g class="l13" transform="translate(0,282)">
      <rect x="0" y="-12" width="320" height="14" rx="3" fill="#313244"/>
      <rect class="progress-fill" x="0" y="-12" width="0" height="14" rx="3" fill="#89b4fa"/>
      <text class="white" x="328" y="0"> done</text>
    </g>

    <!-- Line 14-22: summary output (big block) -->
    <g class="l14" transform="translate(0,306)">
      <text class="mauve bold">  ────────────── 📋 Standup Summary ───────────────</text>
    </g>
    <g class="l15" transform="translate(0,324)">
      <text class="yellow bold">  Yesterday</text>
    </g>
    <g class="l16" transform="translate(0,342)">
      <text class="white">  • Added MkDocs site + GitHub release workflow</text>
    </g>
    <g class="l17" transform="translate(0,360)">
      <text class="white">  • Fixed CLI auth error with Rich error panel</text>
    </g>
    <g class="l18" transform="translate(0,378)">
      <text class="yellow bold">  Today</text>
    </g>
    <g class="l19" transform="translate(0,396)">
      <text class="white">  • Code review, tag v0.8.0 and release</text>
    </g>
    <g class="l20" transform="translate(0,414)">
      <text class="yellow bold">  Blockers</text>
    </g>
    <g class="l21" transform="translate(0,432)">
      <text class="white">  • None 🎉</text>
    </g>
    <g class="l22" transform="translate(0,450)">
      <text class="mauve bold">  ──────────────────────────────────────────────────</text>
    </g>

  </g>
</svg>
